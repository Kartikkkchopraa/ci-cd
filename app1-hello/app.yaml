apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1-hello
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app1-hello
  template:
    metadata:
      labels:
        app: app1-hello
    spec:
      containers:
        - name: app1-hello
          image: kartikchopra254/hello-node:latest
          ports:
            - containerPort: 3000
              

---
apiVersion: v1
kind: Service
metadata:
  name: app1-hello
  labels:
    app: app1-hello
spec:
  selector:
    app: app1-hello
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP
